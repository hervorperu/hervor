<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hervor — Próximamente</title>
  <meta name="description" content="Hervor llega muy pronto. Síguenos en Instagram y TikTok y mira nuestra carta.">
  <meta name="theme-color" content="#452959">

  <!-- Open Graph (vista previa al compartir el enlace) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hervor — Próximamente">
  <meta property="og:description" content="¿Nos tomamos una pausita?">
  <meta property="og:image" content="assets/img/logo-hervor.png">
  <meta property="og:locale" content="es_PE">

  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,600&family=Nunito+Sans:opsz,wght@6..12,800&display=swap" rel="stylesheet">

  <link rel="preload" as="image" href="assets/img/logo-hervor.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="landing">
    <h1 class="landing__logo reveal">
      <img src="assets/img/logo-hervor.png" alt="Hervor" width="887" height="256">
    </h1>

    <p class="landing__title reveal">Próximamente</p>

    <p class="landing__tagline reveal">¿Nos tomamos una pausita?</p>

    <nav class="landing__links" aria-label="Enlaces de Hervor">
      <a class="pill reveal" data-link="instagram" href="#" target="_blank" rel="noopener">
        <svg class="pill__icon" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#fdd835"/><stop offset=".35" stop-color="#f4511e"/>
              <stop offset=".65" stop-color="#e91e63"/><stop offset="1" stop-color="#7b3fe4"/>
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="40" height="40" rx="12" fill="none" stroke="url(#ig)" stroke-width="4.5"/>
          <circle cx="24" cy="24" r="9" fill="none" stroke="url(#ig)" stroke-width="4.5"/>
          <circle cx="35" cy="13" r="2.8" fill="url(#ig)"/>
        </svg>
        <span class="pill__label">Síguenos en Instagram</span>
      </a>

      <a class="pill reveal" data-link="tiktok" href="#" target="_blank" rel="noopener">
        <svg class="pill__icon" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="24" fill="#111"/>
          <g transform="translate(13 10)">
            <path d="M14 0h5c.4 3.6 2.6 6 6 6.4v5c-2.3 0-4.3-.7-6-1.9V19a9 9 0 1 1-9-9v5.1A4 4 0 1 0 14 19Z" fill="#25f4ee" transform="translate(-1.2 -1)"/>
            <path d="M14 0h5c.4 3.6 2.6 6 6 6.4v5c-2.3 0-4.3-.7-6-1.9V19a9 9 0 1 1-9-9v5.1A4 4 0 1 0 14 19Z" fill="#fe2c55" transform="translate(1.2 1)"/>
            <path d="M14 0h5c.4 3.6 2.6 6 6 6.4v5c-2.3 0-4.3-.7-6-1.9V19a9 9 0 1 1-9-9v5.1A4 4 0 1 0 14 19Z" fill="#fff"/>
          </g>
        </svg>
        <span class="pill__label">Síguenos en TikTok</span>
      </a>

      <a class="pill reveal" data-link="carta" href="#" target="_blank" rel="noopener">
        <svg class="pill__icon" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#2a1a33" stroke-linecap="round">
          <!-- cuchara -->
          <ellipse cx="13" cy="12" rx="6" ry="8.5" transform="rotate(-45 13 12)" fill="#2a1a33" stroke="none"/>
          <path d="M17 16 40 41" stroke-width="4.5"/>
          <!-- tenedor -->
          <path d="M31 17 8 41" stroke-width="4.5"/>
          <path d="M31 17c-2-2-1.5-5 1-7.5L38 4M33.5 19.5c2 1.5 5 1 7.5-1.5L44 12M34 15l7-7M32 13l7-7" stroke-width="2.2"/>
        </svg>
        <span class="pill__label">Mira nuestra carta</span>
      </a>
    </nav>

    <p class="toast" role="status" aria-live="polite" hidden></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
